# Runs the RAWRS test suites on GitHub's machines instead of a local PC.
#
# Backend tests run in batches, each batch in its own pytest process, so the
# memory held by PDF/OCR/ML imports is released between batches (a single
# full-suite process was killed for lack of memory on a local machine).
#
# Not covered here:
#   - real_docling / real_surya: real OCR runs, minutes per page.
#   - samples/benchmark/pdfs/ is gitignored (copyrighted), so tests that
#     need those PDFs cannot pass in CI; compare against the first run's
#     baseline rather than expecting all-green.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, Jest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm 11 (bundled with Node 24) matches the npm that writes
          # package-lock.json locally; npm 10 reads its optional deps differently.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Jest
        run: npx jest --ci

      - name: Production build
        run: npm run build

      # Informational only: the codebase has pre-existing lint errors.
      - name: Lint (non-blocking)
        run: npx eslint .
        continue-on-error: true

  backend:
    name: Backend (pytest, batched)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: System libraries for OpenCV / PDF tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.lock was frozen on Windows; drop the Windows-only pins.
          grep -viE '^(pywin32|win32_setctime)==' requirements.lock > "$RUNNER_TEMP/requirements.ci.txt"
          # CPU-only torch of the pinned version: the default Linux wheel pulls
          # several GB of CUDA libraries the tests never use.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.1 torchvision==0.27.1
          python -m pip install -r "$RUNNER_TEMP/requirements.ci.txt" -r requirements-dev.txt

      - name: Run pytest in batches
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          files=(tests/test_*.py)
          chunk=8
          failed=()
          for ((i = 0; i < ${#files[@]}; i += chunk)); do
            n=$((i / chunk + 1))
            batch=("${files[@]:i:chunk}")
            echo "::group::Batch $n: ${batch[*]}"
            set +e
            python -m pytest -q -p no:cacheprovider \
              -m "not real_docling and not real_surya" \
              --junitxml="$RUNNER_TEMP/junit/batch-$n.xml" \
              "${batch[@]}"
            rc=$?
            set -e
            echo "::endgroup::"
            # 5 = no tests collected (e.g. a batch of only excluded markers).
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then
              failed+=("batch $n (exit $rc): ${batch[*]}")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::%s\n' "${failed[@]}"
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: ${{ runner.temp }}/junit/
          if-no-files-found: ignore
